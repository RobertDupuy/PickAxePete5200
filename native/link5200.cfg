MEMORY {
 ZP: start=$0080,size=$0080,type=rw,file="";
 STATE: start=$0800,size=$0400,type=rw,file="";
 HUDRAM: start=$2c00,size=$0400,type=rw,file="";
 RAM: start=$3000,size=$0400,type=rw,file="";
 ROM: start=$4000,size=$7fe8,type=ro,file=%O,fill=yes,fillval=$ff;
 TAIL: start=$bfe8,size=$0018,type=ro,file=%O,fill=yes,fillval=$00;
}
SEGMENTS {
 ZEROPAGE: load=ZP,type=zp;
 BSS: load=STATE,type=bss,define=yes;
 STARTUP: load=ROM,type=ro;
 CODE: load=ROM,type=ro;
 RODATA: load=ROM,type=ro,align=$100;
 AUX: load=ROM,type=ro;
 EXTRA: load=ROM,type=ro;
 HUDFONT: load=ROM,run=HUDRAM,type=rw,define=yes;
 RAMCODE: load=ROM,run=RAM,type=rw,define=yes;
 TAIL: load=TAIL,type=ro;
}
